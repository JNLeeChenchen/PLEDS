application: flow_record_collection
input:
  format: pcap
  path: ../data/trace.pcap
  window_seconds: 1
training:
  windows: [0, 1]
  hot_fraction: 0.1
  max_per_class: 4096
  seed: 7
validation:
  windows: [2]
  slot_duration_ms: 100
  slots_per_window: 5
models:
  - type: decision_tree
    feature_counts: [12, 104]
    parameters:
      max_depth: 5
      min_samples_leaf: 10
  - type: random_forest_ensemble
    feature_counts: [12]
    parameters:
      n_estimators: 3
      max_depth: 3
      max_leaf_nodes: 8
  - type: rule_list
    feature_counts: [104]
    parameters:
      max_rules: 64
search:
  memory_kib: [16, 32, 64, 128]
  mechanisms: [partitioning, tiering]
  include_conventional: true
  exact_bank_counts: [1, 2]
constraints:
  max_stages: 12
  max_tcam_entries: 1024
  max_tcam_units: 16
  max_sram_units: 128
  max_metadata_bits: 1024
  max_hash_units: 8
