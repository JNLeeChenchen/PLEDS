application: flow_record_collection
input:
  format: demo
training:
  windows: [0]
  hot_fraction: 0.125
  max_per_class: 4096
  seed: 7
validation:
  windows: [1]
  slot_duration_ms: 1000
  slots_per_window: 1
models:
  - type: decision_tree
    feature_counts: [12, 104]
    parameters:
      - max_depth: 3
        min_samples_leaf: 2
      - max_depth: 5
        min_samples_leaf: 2
  - type: rule_list
    feature_counts: [104]
    parameters:
      max_rules: 16
search:
  memory_kib: [16]
  mechanisms: [partitioning, tiering]
  include_conventional: true
  exact_bank_counts: [1]
constraints:
  max_stages: 12
  max_tcam_entries: 1024
  max_tcam_units: 16
  max_sram_units: 128
  max_metadata_bits: 1024
  max_hash_units: 8
