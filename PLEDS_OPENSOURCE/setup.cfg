[metadata]
name = pleds
version = 0.2.0
description = PLEDS FlowRadar review release
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/JNLeeChenchen/PLEDS
license = Apache-2.0
license_files = LICENSE, NOTICE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.22,<2
    scipy>=1.9
    scikit-learn>=1.1
    PyYAML>=6
    pyarrow>=10
    dpkt>=1.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pleds = pleds.cli:main

[options.extras_require]
tm = tmu==0.8.1
xgboost = xgboost>=1.7,<3
dev = pytest>=7
all =
    tmu==0.8.1
    xgboost>=1.7,<3
    pytest>=7
